    <radialGradient id="secCyanGlow" cx="80%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>

    <filter id="secGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="matrixGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 0, 85, 0.08)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(255, 0, 85, 0.3)"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#cyberBg)"/>
  <rect width="1200" height="630" fill="url(#matrixGrid)"/>
  <rect width="1200" height="630" fill="url(#alertGlow)"/>
  <rect width="1200" height="630" fill="url(#secCyanGlow)"/>

  <!-- Top Security Command Bar -->
  <rect x="50" y="40" width="1100" height="42" rx="8" fill="rgba(19, 7, 24, 0.8)" stroke="rgba(255, 0, 85, 0.4)" stroke-width="1.2"/>
  <circle cx="75" cy="61" r="5" fill="#ff0055"/>
