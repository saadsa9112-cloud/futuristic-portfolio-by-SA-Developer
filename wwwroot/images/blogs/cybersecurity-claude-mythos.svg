      <text y="0" fill="#ff4d79">// Zero-Trust Immutable Guardrail Pattern</text>
      <text y="20" fill="#a855f7">public async Task&lt;<tspan fill="#38bdf8">SecResult</tspan>&gt; <tspan fill="#00f0ff">ValidateContextAsync</tspan>()</text>
      <text y="38" fill="#cbd5e1">{</text>
      <text y="56" x="18" fill="#cbd5e1"><tspan fill="#a855f7">var</tspan> envelope = <tspan fill="#38bdf8">MythosQuarantine</tspan>.<tspan fill="#00f0ff">WrapUntrustedPayload</tspan>(input);</text>
      <text y="74" x="18" fill="#cbd5e1"><tspan fill="#a855f7">await</tspan> <tspan fill="#38bdf8">SecOpsEngine</tspan>.<tspan fill="#00f0ff">InspectAstInvariantsAsync</tspan>(envelope);</text>
      <text y="92" x="18" fill="#a855f7">return <tspan fill="#4ade80">SecResult.SanitizedAndHardened</tspan>;</text>
      <text y="110" fill="#cbd5e1">}</text>
