  <!-- Footer Credit -->
  <text x="60" y="605" fill="#64748b" font-family="'Consolas', monospace" font-size="12">AUTHORED BY HAFIZ MUHAMMAD SAAD // SENIOR SYSTEM ARCHITECT &amp; CYBERSECURITY ENGINEER</text>
