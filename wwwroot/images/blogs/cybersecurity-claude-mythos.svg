  <path d="M 1170 50 L 1170 30 L 1150 30" stroke="#00f0ff" stroke-width="2.5" fill="none"/>
  <path d="M 30 580 L 30 600 L 50 600" stroke="#ff0055" stroke-width="2.5" fill="none"/>
