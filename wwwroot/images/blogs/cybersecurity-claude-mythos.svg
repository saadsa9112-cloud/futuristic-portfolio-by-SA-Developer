<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05020c"/>
      <stop offset="50%" stop-color="#120516"/>
      <stop offset="100%" stop-color="#06020f"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <linearGradient id="redGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="50%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <radialGradient id="alertGlow" cx="25%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ff0055" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
