<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05030d"/>
      <stop offset="50%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#030208"/>
    </linearGradient>

    <linearGradient id="cyberRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 240, 255, 0.06)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="rgba(0, 240, 255, 0.2)"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Under Dev Warning Strip Top -->
  <rect x="0" y="0" width="800" height="8" fill="#f59e0b"/>

  <!-- Top Window Bar -->
  <rect x="25" y="25" width="750" height="36" rx="6" fill="rgba(19, 12, 34, 0.9)" stroke="rgba(255, 0, 85, 0.35)" stroke-width="1"/>
  <circle cx="45" cy="43" r="4.5" fill="#ff0055"/>
  <circle cx="60" cy="43" r="4.5" fill="#ffbd2e"/>
  <circle cx="75" cy="43" r="4.5" fill="#00ff66"/>
  <text x="100" y="47" fill="#00f0ff" font-family="'Consolas', monospace" font-size="12">cybersentinel@kernel-ebpf:~/siem-telemetry</text>
  <rect x="610" y="32" width="150" height="22" rx="4" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1"/>
  <text x="685" y="47" fill="#f59e0b" font-family="'Consolas', monospace" font-size="10.5" font-weight="bold" text-anchor="middle">UNDER DEVELOPMENT</text>

  <!-- Left Side: Packet Analyzer & Kernel Telemetry -->
  <g transform="translate(35, 75)">
    <rect x="0" y="0" width="410" height="385" rx="8" fill="rgba(11, 6, 22, 0.85)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
    
    <!-- Title -->
    <text x="20" y="30" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">CYBERSENTINEL</text>
    <text x="20" y="48" fill="#00f0ff" font-family="'Consolas', monospace" font-size="11">eBPF High-Throughput Kernel Threat Interceptor</text>

    <!-- Radar / Activity Graph -->
    <g transform="translate(20, 65)">
      <!-- Cyber Threat Grid Graph -->
      <rect x="0" y="0" width="370" height="120" rx="6" fill="rgba(6, 3, 14, 0.9)" stroke="rgba(255, 0, 85, 0.3)" stroke-width="1"/>
      <path d="M 0 90 Q 50 20 100 80 T 200 40 T 280 95 T 370 25" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
      <path d="M 0 100 Q 60 70 120 110 T 220 60 T 300 85 T 370 60" fill="none" stroke="#ff0055" stroke-width="1.8" stroke-dasharray="4,3"/>
      
      <circle cx="280" cy="95" r="4" fill="#ff0055"/>
      <text x="288" y="93" fill="#ff0055" font-family="'Consolas', monospace" font-size="9" font-weight="bold">ANOMALY DETECTED</text>
      
      <circle cx="370" cy="25" r="4" fill="#00ff66"/>
      <text x="315" y="20" fill="#00ff66" font-family="'Consolas', monospace" font-size="9" font-weight="bold">AUTO-QUARANTINE</text>
    </g>

    <!-- Console Trace Output -->
    <g transform="translate(20, 205)" font-family="'Consolas', monospace" font-size="10.5">
      <text y="0" fill="#94a3b8">&gt; eBPF RingBuffer: 540,210 events/sec active</text>
      <text y="18" fill="#38bdf8">&gt; Hook: sys_enter_connect() · Zero-Trust Rule #49</text>
      <text y="36" fill="#ff0055">&gt; [ALERT] Unauthorized lateral token traversal blocked</text>
      <text y="54" fill="#00ff66">&gt; Signed telemetry vector flushed to PostgreSQL via gRPC</text>
      <text y="72" fill="#c084fc">&gt; Stack: C# .NET 10 Native AOT + Rust eBPF Probes</text>
    </g>

    <!-- Progress indicator -->
    <g transform="translate(20, 310)">
      <text x="0" y="12" fill="#f59e0b" font-family="'Consolas', monospace" font-size="11" font-weight="bold">DEVELOPMENT SPRINT 3 // 78% COMPLETE</text>
      <rect x="0" y="20" width="370" height="8" rx="4" fill="rgba(255, 255, 255, 0.1)"/>
      <rect x="0" y="20" width="288" height="8" rx="4" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Right Side: Threat Scorecard & Defensive Shield -->
  <g transform="translate(460, 75)">
    <rect x="0" y="0" width="305" height="385" rx="8" fill="rgba(13, 7, 26, 0.85)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1"/>

    <!-- Shield Icon Visual -->
    <g transform="translate(102, 25)">
      <path d="M 50 10 L 95 25 L 95 70 C 95 105 50 125 50 125 C 50 125 5 105 5 70 L 5 25 Z" fill="rgba(255, 0, 85, 0.15)" stroke="url(#cyberRed)" stroke-width="2.5" filter="url(#glow)"/>
      <circle cx="50" cy="62" r="14" fill="rgba(0, 240, 255, 0.25)" stroke="#00f0ff" stroke-width="1.8"/>
      <path d="M 50 55 L 50 63 M 46 66 L 54 66" stroke="#ffffff" stroke-width="2"/>
    </g>

    <text x="152" y="175" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">DEFENSE TELEMETRY</text>
    <text x="152" y="193" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="11" text-anchor="middle">Threat Vector Mitigation Engine</text>

    <!-- Spec Badges -->
    <g transform="translate(20, 215)">
      <rect x="0" y="0" width="265" height="34" rx="6" fill="rgba(0, 240, 255, 0.1)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
      <text x="12" y="21" fill="#00f0ff" font-family="'Consolas', monospace" font-size="11">⚡ Latency: &lt; 0.18ms</text>
      <text x="250" y="21" fill="#00ff66" font-family="'Consolas', monospace" font-size="11" text-anchor="end">PASSED</text>

      <rect x="0" y="44" width="265" height="34" rx="6" fill="rgba(255, 0, 85, 0.1)" stroke="rgba(255, 0, 85, 0.3)" stroke-width="1"/>
      <text x="12" y="65" fill="#ff4d79" font-family="'Consolas', monospace" font-size="11">🛡️ Zero-Day AST Defense</text>
      <text x="250" y="65" fill="#00ff66" font-family="'Consolas', monospace" font-size="11" text-anchor="end">ARMED</text>

      <rect x="0" y="88" width="265" height="34" rx="6" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
      <text x="12" y="109" fill="#c084fc" font-family="'Consolas', monospace" font-size="11">🔐 Immutable Audit Logs</text>
      <text x="250" y="109" fill="#00ff66" font-family="'Consolas', monospace" font-size="11" text-anchor="end">ACTIVE</text>
    </g>

    <!-- Lab Watermark -->
    <text x="152" y="360" fill="#64748b" font-family="'Consolas', monospace" font-size="10" text-anchor="middle">ACTIVE R&amp;D · BETA RELEASE Q4 2026</text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 15 35 L 15 15 L 35 15" stroke="#00f0ff" stroke-width="2" fill="none"/>
  <path d="M 785 35 L 785 15 L 765 15" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <path d="M 15 465 L 15 485 L 35 485" stroke="#00f0ff" stroke-width="2" fill="none"/>
  <path d="M 785 465 L 785 485 L 765 485" stroke="#f59e0b" stroke-width="2" fill="none"/>
</svg>
