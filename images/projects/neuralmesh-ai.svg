<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="neuralBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04020a"/>
      <stop offset="50%" stop-color="#090518"/>
      <stop offset="100%" stop-color="#020106"/>
    </linearGradient>

    <linearGradient id="purpleCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="neuralGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="hexGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(168, 85, 247, 0.08)" stroke-width="1"/>
      <circle cx="20" cy="20" r="1.5" fill="rgba(0, 240, 255, 0.25)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#neuralBg)"/>
  <rect width="800" height="500" fill="url(#hexGrid)"/>

  <!-- Warning Strip Top -->
  <rect x="0" y="0" width="800" height="8" fill="#f59e0b"/>

  <!-- Window Bar -->
  <rect x="25" y="25" width="750" height="36" rx="6" fill="rgba(15, 10, 28, 0.9)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1"/>
  <circle cx="45" cy="43" r="4.5" fill="#ff5f56"/>
  <circle cx="60" cy="43" r="4.5" fill="#ffbd2e"/>
  <circle cx="75" cy="43" r="4.5" fill="#27c93f"/>
  <text x="100" y="47" fill="#c084fc" font-family="'Consolas', monospace" font-size="12">neuralmesh@swarm-consensus:~/orchestration</text>
  <rect x="610" y="32" width="150" height="22" rx="4" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1"/>
  <text x="685" y="47" fill="#f59e0b" font-family="'Consolas', monospace" font-size="10.5" font-weight="bold" text-anchor="middle">UNDER DEVELOPMENT</text>

  <!-- Left: Swarm Node Topology Diagram -->
  <g transform="translate(35, 75)">
    <rect x="0" y="0" width="410" height="385" rx="8" fill="rgba(10, 6, 20, 0.85)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1"/>
    
    <text x="20" y="30" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">NEURALMESH AI</text>
    <text x="20" y="48" fill="#a855f7" font-family="'Consolas', monospace" font-size="11">Decentralized Agent Swarm &amp; Vector Sharding</text>

    <!-- Node Network Visualization -->
    <g transform="translate(30, 75)">
      <!-- Connecting lines -->
      <line x1="175" y1="100" x2="60" y2="40" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="175" y1="100" x2="290" y2="40" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="175" y1="100" x2="80" y2="170" stroke="#00ff66" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="175" y1="100" x2="270" y2="170" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
      <line x1="60" y1="40" x2="290" y2="40" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

      <!-- Center Swarm Arbiter -->
      <circle cx="175" cy="100" r="30" fill="rgba(168, 85, 247, 0.25)" stroke="#a855f7" stroke-width="2.5" filter="url(#neuralGlow)"/>
      <circle cx="175" cy="100" r="14" fill="#a855f7"/>
      <text x="175" y="145" fill="#ffffff" font-family="'Consolas', monospace" font-size="10" font-weight="bold" text-anchor="middle">SWARM ARBITER</text>

      <!-- Node 1: Code Planner -->
      <circle cx="60" cy="40" r="18" fill="rgba(0, 240, 255, 0.2)" stroke="#00f0ff" stroke-width="2"/>
      <text x="60" y="44" fill="#00f0ff" font-family="'Consolas', monospace" font-size="9" font-weight="bold" text-anchor="middle">PLAN</text>
      <text x="60" y="72" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="9" text-anchor="middle">Agent 01</text>

      <!-- Node 2: SecOps Auditor -->
      <circle cx="290" cy="40" r="18" fill="rgba(255, 0, 85, 0.2)" stroke="#ff0055" stroke-width="2"/>
      <text x="290" y="44" fill="#ff4d79" font-family="'Consolas', monospace" font-size="9" font-weight="bold" text-anchor="middle">SEC</text>
      <text x="290" y="72" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="9" text-anchor="middle">Agent 02</text>

      <!-- Node 3: Formal Verifier -->
      <circle cx="80" cy="170" r="18" fill="rgba(0, 255, 102, 0.2)" stroke="#00ff66" stroke-width="2"/>
      <text x="80" y="174" fill="#00ff66" font-family="'Consolas', monospace" font-size="9" font-weight="bold" text-anchor="middle">VERIF</text>
      <text x="80" y="202" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="9" text-anchor="middle">Agent 03</text>

      <!-- Node 4: Shard Storage -->
      <circle cx="270" cy="170" r="18" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="2"/>
      <text x="270" y="174" fill="#f59e0b" font-family="'Consolas', monospace" font-size="9" font-weight="bold" text-anchor="middle">SHARD</text>
      <text x="270" y="202" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="9" text-anchor="middle">Vector DB</text>
    </g>

    <!-- Development progress -->
    <g transform="translate(20, 310)">
      <text x="0" y="12" fill="#f59e0b" font-family="'Consolas', monospace" font-size="11" font-weight="bold">ARCHITECTURE SPRINT 2 // 65% COMPLETE</text>
      <rect x="0" y="20" width="370" height="8" rx="4" fill="rgba(255, 255, 255, 0.1)"/>
      <rect x="0" y="20" width="240" height="8" rx="4" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Right: Engine Specs & Telemetry -->
  <g transform="translate(460, 75)">
    <rect x="0" y="0" width="305" height="385" rx="8" fill="rgba(12, 7, 24, 0.85)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1"/>

    <g transform="translate(20, 25)">
      <text x="0" y="20" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold">DISTRIBUTED CLUSTERING</text>
      <text x="0" y="38" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="11">Redis Streams · gRPC · ONNX</text>
    </g>

    <g transform="translate(20, 95)" font-family="'Consolas', monospace" font-size="11">
      <rect x="0" y="0" width="265" height="42" rx="6" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
      <text x="12" y="18" fill="#c084fc">Consensus Latency</text>
      <text x="12" y="34" fill="#ffffff" font-weight="bold">&lt; 14ms Distributed Sync</text>

      <rect x="0" y="52" width="265" height="42" rx="6" fill="rgba(0, 240, 255, 0.1)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
      <text x="12" y="70" fill="#38bdf8">Vector Shard Boundary</text>
      <text x="12" y="86" fill="#ffffff" font-weight="bold">Zero Context Contamination</text>

      <rect x="0" y="104" width="265" height="42" rx="6" fill="rgba(0, 255, 102, 0.1)" stroke="rgba(0, 255, 102, 0.3)" stroke-width="1"/>
      <text x="12" y="122" fill="#4ade80">Constitutional Guard</text>
      <text x="12" y="138" fill="#ffffff" font-weight="bold">Formal Semantic Verifier</text>
    </g>

    <!-- Lab Beta Tag -->
    <rect x="20" y="280" width="265" height="60" rx="6" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
    <text x="32" y="303" fill="#f59e0b" font-family="'Consolas', monospace" font-size="11" font-weight="bold">⚠️ SYSTEM UNDER ACTIVE DEVELOPMENT</text>
    <text x="32" y="322" fill="#cbd5e1" font-family="'Consolas', monospace" font-size="10.5">Prototype in sandbox · Public Beta Q1 2027</text>

    <text x="152" y="365" fill="#64748b" font-family="'Consolas', monospace" font-size="10" text-anchor="middle">HAFIZ MUHAMMAD SAAD · R&amp;D LABS</text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 15 35 L 15 15 L 35 15" stroke="#a855f7" stroke-width="2" fill="none"/>
  <path d="M 785 35 L 785 15 L 765 15" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <path d="M 15 465 L 15 485 L 35 485" stroke="#a855f7" stroke-width="2" fill="none"/>
  <path d="M 785 465 L 785 485 L 765 485" stroke="#f59e0b" stroke-width="2" fill="none"/>
</svg>
